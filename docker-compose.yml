name: nutrimatch

services:
  db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrimatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - db_admin

  redis:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no", "--bind", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  migrate:
    image: golang:1.26.2-trixie
    restart: "no"
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nutrimatch}?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nutrimatch}?sslmode=disable
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go/cache
    volumes:
      - ./backend:/workspace/backend:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    command:
      - /bin/sh
      - -ec
      - go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 -dir ./migrations up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress

  api:
    image: golang:1.26.2-trixie
    restart: unless-stopped
    working_dir: /workspace/backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: postgres://app:password123@db:5432/${POSTGRES_DB:-nutrimatch}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-64-characters-minimum-value}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-refresh-token-pepper-change-me-64-characters-value}
      HEALTH_DATA_ENCRYPTION_KEY: ${HEALTH_DATA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:-abcdef0123456789abcdef0123456789}
      SENSITIVE_DATA_INDEX_KEY: ${SENSITIVE_DATA_INDEX_KEY:-fedcba9876543210fedcba9876543210}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      SPOONACULAR_BASE_URL: ${SPOONACULAR_BASE_URL:-https://api.spoonacular.com}
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL:-https://generativelanguage.googleapis.com}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oidc/callback}
      OIDC_FRONTEND_SUCCESS_URL: ${OIDC_FRONTEND_SUCCESS_URL:-http://localhost:3000/auth/oidc/callback}
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go/cache
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    command: ["go", "run", "./cmd/api"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress

  frontend:
    image: node:24.13.0-trixie
    restart: unless-stopped
    working_dir: /workspace/frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next_cache:/workspace/frontend/build
    command:
      - /bin/sh
      - -ec
      - npm ci && npm run dev -- --hostname 0.0.0.0
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend

networks:
  backend:
    internal: true
  db_admin:
  egress:
  frontend:

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  frontend_node_modules:
  frontend_next_cache:
