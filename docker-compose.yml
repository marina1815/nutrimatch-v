name: nutrimatch

services:
  db:
    image: postgres:18.3-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrimatch}
      POSTGRES_USER: ${POSTGRES_USER:-nutrimatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrimatch_dev_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  migrate:
    image: golang:1.26.2-trixie
    restart: "no"
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nutrimatch}:${POSTGRES_PASSWORD:-nutrimatch_dev_change_me}@db:5432/${POSTGRES_DB:-nutrimatch}?sslmode=disable
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go/cache
    volumes:
      - ./backend:/workspace/backend:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    command:
      - /bin/sh
      - -ec
      - go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 -dir ./migrations postgres "$$DATABASE_URL" up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    image: golang:1.26.2-trixie
    restart: unless-stopped
    working_dir: /workspace/backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-nutrimatch}:${POSTGRES_PASSWORD:-nutrimatch_dev_change_me}@db:5432/${POSTGRES_DB:-nutrimatch}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-64-characters-minimum-value}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-refresh-token-pepper-change-me-64-characters-value}
      HEALTH_DATA_ENCRYPTION_KEY: ${HEALTH_DATA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      SPOONACULAR_BASE_URL: ${SPOONACULAR_BASE_URL:-https://api.spoonacular.com}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL:-https://generativelanguage.googleapis.com}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oidc/callback}
      OIDC_FRONTEND_SUCCESS_URL: ${OIDC_FRONTEND_SUCCESS_URL:-http://localhost:3000/auth/oidc/callback}
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go/cache
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    command: ["go", "run", "./cmd/api"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  frontend:
    image: node:24.13.0-trixie
    restart: unless-stopped
    working_dir: /workspace/frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next_cache:/workspace/frontend/build
    command:
      - /bin/sh
      - -ec
      - npm ci && npm run dev -- --hostname 0.0.0.0
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  frontend_node_modules:
  frontend_next_cache:
